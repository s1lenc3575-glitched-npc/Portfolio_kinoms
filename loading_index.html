<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="refresh" content="2.5;url=home.html">
    
    <title>Loading... | Jasper Kinomnga</title>
    <style>
    
        :root {
            --bg-color: #000000;
            --secondary-bg: rgba(18, 18, 18, 0.55);
            --card-bg: rgba(26, 26, 26, 0.45);
            --accent-color: #f5deb3;
            --main-text: #f5deb3;
            --off-white: #faf0e6;
            --muted-text: #d2b48c;
            --border-color: rgba(245, 222, 179, 0.15);
            --border-hover: rgba(245, 222, 179, 0.4);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

      
        .page-transition {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: universalFade 2.5s ease-in-out forwards;
        }

   
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 3rem;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

   
        .loading-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, rgba(245, 222, 179, 0.05) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

     
        .media-wrapper {
            max-width: 400px;
            width: 100%;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
        }

        video, img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: contain;
        }

    
        .brand-name {
            color: var(--main-text);
            font-size: 1.5rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            margin: 0;
            font-weight: 300;
        }


        @keyframes universalFade {
            0% {
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            85% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .loading-container {
                padding: 2rem;
            }
            .media-wrapper {
                max-width: 280px;
            }
            .brand-name {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="page-transition">
        <div class="loading-container">
            <div class="media-wrapper">
                <video autoplay muted loop playsinline>
                    <source src="loadingcat.mp4" type="video/mp4">
                </video>
            </div>
            <h1 class="brand-name">Loading...</h1>
        </div>
    </div>

</body>
</html>
