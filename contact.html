<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jasper Kinomnga</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="window-frame">
        <div class="bg-glow-1"></div>
        <header>
            <a href="loading_index.html" class="logo">JASPER</a>
            <ul class="nav-links">
                <li><a href="loading_about.html">About</a></li>
                <li><a href="loading_projects.html">Projects</a></li>
                <li><a href="loading_portfolio.html">Portfolio</a></li>
                <li><a href="loading_contact.html" class="active">Contact</a></li>
            </ul>
            <a href="loading_contact.html" class="contact-btn desktop-btn">Contact Me</a>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>
        <main class="page-content contact-layout">
            <div>
                <h1 class="page-title">Let's <strong>Connect</strong></h1>
                <p class="page-text">Feel free to reach out if you're looking for a developer, have a question, or just want to connect.</p>
                <div style="color: var(--off-white); margin-bottom: 10px;">Email: jasper@example.com</div>
                <div style="color: var(--off-white); margin-bottom: 10px;">Phone: +63 000-0000-000</div>
                <div style="color: var(--off-white);">Location: Baguio City, Philippines</div>
            </div>
            
            <div class="contact-box">
                <form action="#" method="get">
                    <div class="input-group">
                        <label>Name</label>
                        <input type="text" placeholder="Your Name" required>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" placeholder="Your Email" required>
                    </div>
                    <div class="input-group">
                        <label>Message</label>
                        <textarea rows="4" placeholder="How can I help you?" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
